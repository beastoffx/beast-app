<!DOCTYPE html>
<html>
<head>

    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for

    For more details:

    This is a placeholder for base href that will be replaced by the value of

  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="beast_academy">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Google Sign-In Client ID -->
  <meta name="google-signin-client_id" content="303787781202-pi1snm4h30j4immc10npj9hj7ptp819n.apps.googleusercontent.com">

  <title>B.E.A.S.T ACADEMY</title>
  <link rel="manifest" href="manifest.json">

  <!-- Preload Bundled Space Grotesk Fonts -->
  <link rel="preload" href="assets/assets/fonts/SpaceGrotesk-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/assets/fonts/SpaceGrotesk-Medium.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/assets/fonts/SpaceGrotesk-Bold.ttf" as="font" type="font/ttf" crossorigin>

  <style>
    @font-face {
      font-family: 'SpaceGrotesk';
      src: url('assets/assets/fonts/SpaceGrotesk-Light.ttf') format('truetype'),
           url('assets/fonts/SpaceGrotesk-Light.ttf') format('truetype');
      font-weight: 300;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'SpaceGrotesk';
      src: url('assets/assets/fonts/SpaceGrotesk-Regular.ttf') format('truetype'),
           url('assets/fonts/SpaceGrotesk-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'SpaceGrotesk';
      src: url('assets/assets/fonts/SpaceGrotesk-Medium.ttf') format('truetype'),
           url('assets/fonts/SpaceGrotesk-Medium.ttf') format('truetype');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'SpaceGrotesk';
      src: url('assets/assets/fonts/SpaceGrotesk-Bold.ttf') format('truetype'),
           url('assets/fonts/SpaceGrotesk-Bold.ttf') format('truetype');
      font-weight: 600 700 800 900;
      font-style: normal;
      font-display: swap;

      font-family: 'SpaceGrotesk', sans-serif;
    }
